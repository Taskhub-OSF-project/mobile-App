name: taskhub_mobile
description: "TaskHub mobile application - connect students and hirers for freelance tasks"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.10.0

  # Secure Storage
  flutter_secure_storage: ^10.3.1

  # Routing
  go_router: ^17.3.0

  # JSON Serialization
  json_annotation: ^4.12.0

  # Date/Time
  intl: ^0.20.3

  # UI Utilities
  cached_network_image: ^3.4.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Utilities
  equatable: ^2.1.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
