name: taskhub_mobile
description: "TaskHub mobile application - connect students and hirers for freelance tasks"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.6.2

  # JSON Serialization
  json_annotation: ^4.9.0

  # Date/Time
  intl: ^0.19.0

  # UI Utilities
  cached_network_image: ^3.4.1

  # Utilities
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
